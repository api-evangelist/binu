name: Binu
description: "Datafree Technologies (originally biNu, founded 2008 and headquartered
  in Sydney, Australia) operates a #datafree reverse-billing connectivity platform
  that lets enterprises sponsor the mobile data cost of their websites, apps and portals
  so end users can reach those digital services without spending their own airtime
  or data - much like a toll-free number, but for the mobile internet. Widely deployed
  across South African mobile networks, the platform works on any device with no new
  SIM, top-up or contract, and layers on security controls, allowlist management,
  time windows, usage caps and audit logging. Products include the Datafree Platform
  and Datafree Connect. Backed by 500 Global."
